[package]
name = "pantheon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Package `pantheon-cli`, binary `pantheon`. The package name keeps the crate's
# role obvious in the workspace; the binary name is the operator-facing command.
[[bin]]
name = "pantheon"
path = "src/main.rs"
