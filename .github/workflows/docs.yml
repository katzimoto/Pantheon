name: Docs

# Runs on every push and pull request rather than only on docs/** changes.
# The check takes about a second, and a path-filtered required check never
# reports on PRs that touch no documentation, which leaves branch protection
# waiting on a status that will never arrive.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    name: Validate documentation structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # POSIX sh, no dependencies, so there is nothing to install or cache.
      # Verifies that every documentation reference resolves and that the
      # architecture map lists every canonical contract exactly once.
      - name: Check documentation references and map completeness
        run: ./scripts/check-docs-links.sh
