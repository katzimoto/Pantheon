name: Apply Repository Label Taxonomy

on:
  push:
    branches: [ci/repository-label-taxonomy]
    paths: [.github/workflows/_apply-label-taxonomy.yml]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Self-test label policy
        run: |
          python3 scripts/version-automation.py self-test
          python3 scripts/repository-labels.py self-test

      - name: Patch canonical label guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          missions = Path('docs/development/missions.md')
          text = missions.read_text()
          anchor = '''Nothing else is a field. Implementation plans, file lists, function names,
          branch names, estimates, model choice and agent instructions are all either
          owned by another layer or discoverable from the repository, and each one is
          wrong the moment the repository moves.

          ## Relationships
          '''
          replacement = '''Nothing else is a field. Implementation plans, file lists, function names,
          branch names, estimates, model choice and agent instructions are all either
          owned by another layer or discoverable from the repository, and each one is
          wrong the moment the repository moves.

          ## Labels

          Labels are orthogonal query/release metadata, not another work-state model.
          GitHub-native state remains authoritative for completion, Version membership,
          dependencies, hierarchy, assignees, and review/check status. Pantheon does not
          use `status:*`, `priority:*`, `version:*`, `kind:*`, blocker, parent/epic, or
          readiness labels to mirror those facts.

          Every Engineering Mission has one primary `area:*` label. A mission whose
          observable outcome genuinely spans two domains may carry one additional
          secondary area; more than two is a sign that the mission is too broad or the
          labels are being used as a dependency list. Area labels are broad discovery
          facets, not a replacement for Architecture entry points:

          ```text
          area:goals-planning
          area:tasks
          area:scheduling
          area:execution
          area:agents-context
          area:evaluation-acceptance
          area:artifacts-workspaces
          area:security
          area:persistence-recovery
          area:operations
          area:repository
          ```

          `area:repository` is for repository tooling, CI, documentation process, and
          development infrastructure rather than a Pantheon runtime subsystem.

          A Mission assigned to a Version Milestone additionally carries exactly one
          `changelog:*` label under `docs/development/versions.md`. Changelog
          classification belongs to the Mission outcome and is not copied onto its pull
          requests. `good first issue` and `help wanted` are optional contributor-discovery
          signals; they do not change mission semantics.

          ## Relationships
          '''
          if anchor not in text:
              raise SystemExit('missions.md anchor not found')
          missions.write_text(text.replace(anchor, replacement, 1))

          versions = Path('docs/development/versions.md')
          text = versions.read_text()
          old = '''`.github/release.yml` configures GitHub's native generated release notes only as a fallback or sanity-check projection. Native generated notes, commit ranges and pull-request labels never redefine Version membership or the authoritative Pantheon changelog candidate.'''
          new = '''`.github/release.yml` configures GitHub's native generated release notes only as a supplemental merged-pull-request view. GitHub categorizes that view from pull-request metadata, while Pantheon's changelog classification lives on Engineering Mission Issues; therefore Pantheon does not copy `changelog:*` labels onto PRs merely to influence native notes. Native generated notes, commit ranges and pull-request labels never redefine Version membership or the authoritative Pantheon changelog candidate.'''
          if old not in text:
              raise SystemExit('versions.md release-note anchor not found')
          text = text.replace(old, new, 1)
          old = '''- `.github/workflows/version-labels.yml` is the explicit manual bootstrap/reconciliation path for the `changelog:*` repository labels.'''
          new = '''- `.github/workflows/version-labels.yml` is the explicit manual reconciliation path for the approved repository taxonomy: `changelog:*`, `area:*`, contributor-discovery labels, and removal of explicitly deprecated GitHub defaults.'''
          if old not in text:
              raise SystemExit('versions.md workflow anchor not found')
          versions.write_text(text.replace(old, new, 1))

          form = Path('.github/ISSUE_TEMPLATE/engineering-mission.yml')
          text = form.read_text()
          old = '''        Hierarchy and blockers belong in GitHub's own graph: use sub-issues for
                  decomposition and blocked-by/blocking for dependencies rather than
                  writing them into the body. `docs/development/missions.md` is the full
                  contract behind this form.

                  This repository is public.'''
          new = '''        Hierarchy and blockers belong in GitHub's own graph: use sub-issues for
                  decomposition and blocked-by/blocking for dependencies rather than
                  writing them into the body. After creation, assign one primary `area:*`
                  label (and at most one genuine secondary area); a Version Mission also
                  gets exactly one `changelog:*` classification. Labels never mirror
                  status, priority, Version, blockers or hierarchy. `docs/development/missions.md`
                  is the full contract behind this form.

                  This repository is public.'''
          if old not in text:
              raise SystemExit('engineering-mission.yml anchor not found')
          form.write_text(text.replace(old, new, 1))
          PY

      - name: Reconcile GitHub labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/version-automation.py bootstrap-labels
          python3 scripts/repository-labels.py reconcile

      - name: Classify active MVP Missions by area
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          assignments = {
              16: 'area:persistence-recovery',
              17: 'area:persistence-recovery',
              18: 'area:persistence-recovery',
              19: 'area:repository',
          }
          for issue, label in assignments.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue}/labels',
                  data=json.dumps({'labels': [label]}).encode(),
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req):
                  pass
          PY
          python3 scripts/repository-labels.py validate-milestone --milestone 1

      - name: Commit canonical guidance and remove bootstrap
        run: |
          rm .github/workflows/_apply-label-taxonomy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/development/missions.md docs/development/versions.md .github/ISSUE_TEMPLATE/engineering-mission.yml .github/workflows/_apply-label-taxonomy.yml
          git commit -m "docs: define repository label semantics"
          git push origin HEAD:ci/repository-label-taxonomy
