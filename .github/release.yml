# Native GitHub generated release notes are a supplemental merged-PR view only.
# Pantheon's authoritative release scope and changelog come from the Version
# Milestone and its Engineering Mission labels; scripts/version-automation.py
# generates that release projection. Do not duplicate Mission changelog labels
# onto pull requests merely to influence this fallback view.
changelog:
  categories:
    - title: Merged pull requests (supplemental)
      labels:
        - "*"
